[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag"
version = "0.1.0"
description = "Permission-aware multi-tenant RAG: Postgres row-level security, audited retrieval, leakage evals"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
